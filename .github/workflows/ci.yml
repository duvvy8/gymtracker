name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Design system checks
        run: |
          npm run check:tokens
          npm run check:contrast

      - name: Build
        run: npm run build

      - name: HTTP boundary regression checks
        run: npm run check:http

      - name: Barcode regression checks
        run: npm run check:barcode

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
